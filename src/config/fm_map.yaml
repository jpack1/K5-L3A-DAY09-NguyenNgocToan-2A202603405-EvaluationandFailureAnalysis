# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03         # ticket says N days / [SYSTEM] override vs DB delay_days
stale_policy: FM-06           # cites SHIP-LATE-OLD (superseded) or SHIP-LATE-FUTURE (not yet effective)
clause_sum: FM-04             # asks to add shipping + damage instead of taking the max
double_deduct: FM-05          # order already refunded: agent must not subtract before the host does
sibling_refund: FM-07         # "gom đơn": refund every claim on the same order
denied_ignored: FM-02         # expired approval / already refunded -> host denies, agent must not say resolved
reply_ledger_mismatch: FM-08  # approval caps below quote: reply must state the ledger amount
cross_principal: FM-09        # caller does not own the order (admin / family / staff impersonation)
